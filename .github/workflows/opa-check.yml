
name: Organization OPA Policy Validation

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  opa-validation:
    name: Run OPA Policy Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout central OPA policy repository
        uses: actions/checkout@v4
        with:
          repository: Security-Engineer-Org/opa-test
          ref: main
          path: opa-policy
          token: ${{ secrets.OPA_POLICY_READ_TOKEN }}

      - name: Install OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Check Rego syntax
        run: opa check opa-policy/policies

      - name: Execute OPA tests
        run: opa test opa-policy/policies -v
